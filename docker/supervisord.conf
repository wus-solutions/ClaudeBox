[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; -i lo ist die Sicherheitszusicherung: ttyd darf nie auf einem Interface
; lauschen, das ausserhalb des Netzwerk-Namespaces erreichbar waere.
; -W erlaubt Tastatureingaben; ohne das ist das Terminal nur lesbar.
[program:ttyd]
command=/usr/local/bin/ttyd -p 7681 -i lo -W tmux new -A -s main
user=dev
directory=/workspace
environment=HOME="/home/dev",TERM="xterm-256color"
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true


; Die Agenten-Prozesse erzeugt render-agents.py beim Start aus agents/<name>.md.
; Ein weiterer Agent ist damit eine Datei plus ein Eintrag in BUZZ_AGENTS -
; keine Aenderung an dieser Datei und keine am Compose-File.
[include]
files = /etc/supervisor/conf.d/*.conf
