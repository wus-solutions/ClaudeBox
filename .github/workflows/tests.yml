name: Tests und Deployment

# Bei jedem Push und jedem Pull Request.
on:
  push:
  pull_request:

# Nur Lesezugriff. Der Workflow schreibt nichts ins Repository zurueck.
permissions:
  contents: read

# Ein neuer Push auf denselben Zweig macht den vorherigen Lauf hinfaellig.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testsuite
    runs-on: ubuntu-latest
    # Der Runner ist amd64: das Image baut ohne Emulation. Grosszuegig trotzdem,
    # weil der erste Lauf mit kaltem Cache Node-Pakete und apt zieht.
    timeout-minutes: 45

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7.0.1

      # Braucht weder .env noch Tailnet. Faengt ab, was unter Coolify schon
      # einmal den Start verhindert hat: Bind-Mounts aus dem Repo und ein
      # doppeltes --hostname fuer den Tailscale-Sidecar.
      - name: Compose-Datei und Sidecar-Image
        run: ./test/compose.sh

      # Baut das Image und prueft es von aussen: Web-Terminal nur auf lo,
      # Credential-Helper, SSH, Agenten-Rendering, agent-watch.
      # test/stack.sh laeuft hier bewusst NICHT - es braucht einen Auth-Key und
      # meldete bei jedem Lauf einen neuen Node im Tailnet an.
      - name: Image
        run: ./test/image.sh

  # ==========================================================================
  # Erst wenn die Suite gruen ist, wird ausgerollt.
  # ==========================================================================
  #
  # WICHTIG, sonst wirkt dieser Job nicht: Das automatische Deployment muss in
  # Coolify AUSGESCHALTET bleiben (Automatic Deployment / "Auto Deploy" aus).
  # Coolify sieht die Testlaeufe von GitHub nicht und deployte sonst beim Push
  # weiterhin selbst, parallel zu diesem Job und ohne auf die Tests zu warten.
  deploy:
    name: Deployment anstossen
    # Ist der Job "tests" rot, laeuft dieser hier gar nicht erst an.
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Nur der Zweig main, und nur ein echter Push. Ohne die zweite Bedingung
    # wuerde auch ein Pull Request gegen main deployen - also fremder Code,
    # bevor ihn jemand gesehen hat.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Fehlt ein Secret, soll das hier stehen und nicht als kryptischer
      # curl-Fehler drei Zeilen spaeter.
      - name: Sind die Zugangsdaten hinterlegt?
        env:
          URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
        run: |
          fehlt=0
          if [ -z "$TOKEN" ]; then
            echo "COOLIFY_AUTH_TOKEN ist nicht gesetzt."
            echo "In Coolify unter 'Keys & Tokens' einen API-Token mit Deploy-Recht"
            echo "anlegen und hinterlegen:  gh secret set COOLIFY_AUTH_TOKEN"
            fehlt=1
          fi
          if [ -z "$URL" ]; then
            echo "COOLIFY_WEBHOOK_URL ist nicht gesetzt."
            echo "Das ist die Deploy-Adresse der Anwendung aus Coolify (Webhooks),"
            echo "  https://<coolify>/api/v1/deploy?uuid=<app-uuid>"
            echo "Hinterlegen mit:  gh secret set COOLIFY_WEBHOOK_URL"
            fehlt=1
          fi
          [ "$fehlt" = "0" ] || exit 1

      - name: Coolify anstossen
        env:
          # Ueber die Umgebung und nicht direkt in die Kommandozeile: Sonst
          # stuende der Token im Klartext in der Prozessliste des Runners.
          URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_AUTH_TOKEN }}
        run: |
          # force=false: Coolify baut nur, was sich geaendert hat, und nutzt
          # seinen Docker-Cache. Nur anhaengen, wenn der Parameter fehlt -
          # Coolify zeigt die Adresse je nach Stelle mit oder ohne ihn an.
          case "$URL" in
            *force=*) ziel="$URL" ;;
            *)        ziel="$URL&force=false" ;;
          esac

          code=$(curl -sS -o antwort.txt -w '%{http_code}' \
                   -X POST "$ziel" \
                   -H "Authorization: Bearer $TOKEN")

          echo "Antwort von Coolify (HTTP $code):"
          cat antwort.txt
          echo

          # Bewusst der Statuscode und nicht der Antworttext: eine Pruefung auf
          # "deployment queued" haengt an Coolifys Formulierung.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Coolify hat den Deploy-Anstoss nicht angenommen (HTTP $code)."
            exit 1
          fi

          uuid=$(grep -o '"deployment_uuid":"[^"]*"' antwort.txt | cut -d'"' -f4 || true)
          [ -n "$uuid" ] && echo "Deployment-UUID: $uuid"
          echo "Deployment angestossen. Ob es durchlaeuft, steht in Coolify."
